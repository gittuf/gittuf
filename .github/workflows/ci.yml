name: tests
on:
  push:
    branches: ['main']
    paths-ignore:
      - "docs/*"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/*"
      - "**.md"
permissions: read-all
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.27']
        storer: [binary, go-git]
    runs-on: ${{ matrix.os }}
    env:
      GITTUF_STORER: ${{ matrix.storer }}
      # The go-git backend is experimental, so selecting it requires developer
      # mode.
      GITTUF_DEV: ${{ matrix.storer == 'go-git' && '1' || '' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Move Go cache to D drive
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "D:\gopath"
        New-Item -ItemType Directory -Force -Path "D:\gocache"
        "GOPATH=D:\gopath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "GOCACHE=D:\gocache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "Go paths moved to D drive successfully"
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
    - name: Use Git for Windows' bundled gpg (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      # Appended to the end of PATH (via GITHUB_ENV) rather than the front
      # (via GITHUB_PATH), so this only fills in gpg, which isn't on PATH
      # otherwise, without shadowing tools like ssh-keygen that already
      # resolve to the Windows OpenSSH build earlier in PATH.
      run: echo "PATH=$env:PATH;C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Test
      run: go test -race -timeout 40m ./...
  test-freebsd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Test in FreeBSD
      id: test
      uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480
      with:
        usesh: true
        prepare: |
        run: |
          pkg update -f
          pkg install -y git wget gnupg

          wget https://go.dev/dl/go1.26.1.freebsd-amd64.tar.gz
          tar -C /usr/local -xzf go1.26.1.freebsd-amd64.tar.gz

          /usr/local/go/bin/go test -race -timeout 40m ./...
