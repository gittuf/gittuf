name: tests

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/*"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/*"
      - "**.md"

permissions: read-all

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.26", "1.27"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Move Go cache to D drive
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "D:\gopath"
          New-Item -ItemType Directory -Force -Path "D:\gocache"
          "GOPATH=D:\gopath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GOCACHE=D:\gocache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Go paths moved to D drive successfully"

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Test
        run: go test -race -timeout 40m ./...

  test-freebsd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Test in FreeBSD
        id: test
        uses: vmactions/freebsd-vm@5a72679103d223925653750faa878a143340fbd0
        with:
          usesh: true
          prepare: |
          run: |
            pkg update -f
            pkg install -y git wget gnupg

            wget https://go.dev/dl/go1.26.1.freebsd-amd64.tar.gz
            tar -C /usr/local -xzf go1.26.1.freebsd-amd64.tar.gz

            /usr/local/go/bin/go test -race -timeout 40m ./...

  test-e2e:
    strategy:
      matrix:
        go-version: ["1.26", "1.27"]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install gittuf
        run: make just-install

      - name: Run e2e tests
        run: bash tests/run_e2e_tests.sh
